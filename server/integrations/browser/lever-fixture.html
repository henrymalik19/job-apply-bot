<!doctype html>
<!-- A stand-in for Lever's hosted application form (jobs.lever.co/<company>/<id>/apply), with the live
     form's structure: fields by name, a resume upload that "analyzes" the file and then overwrites
     name, email and location with what it read (as Lever does, after a delay), a location box with
     .dropdown-location suggestions and a hidden selectedLocation, card questions (a real <select>,
     radios, checkboxes, a textarea), a survey hidden for another region, and submit. -->
<html>
<head><meta charset="utf-8"><title>Lever fixture</title>
<style>.hidden { display: none; }</style></head>
<body>
  <form id="application-form">
    <div>
      <input type="file" name="resume" id="resume-upload-input">
      <span class="resume-upload-working hidden">Analyzing resume...</span>
      <span class="resume-upload-success hidden">Success!</span>
      <span class="filename"></span>
    </div>
    <label>Full name <input type="text" name="name" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Current location <input type="text" name="location" id="location-input" required></label>
    <input type="hidden" name="selectedLocation">
    <div id="location-dropdown"></div>
    <label>Current company <input type="text" name="org"></label>
    <div class="application-question">
      <div>How did you hear about us?</div>
      <select name="cards[c1][field0]"><option value="">Select…</option><option value="Friend">Friend</option><option value="Company website">Company website</option></select>
    </div>
    <div class="application-question">
      <div>Are you authorized to work in the US?</div>
      <label><input type="radio" name="cards[c1][field1]" value="Yes">Yes</label>
      <label><input type="radio" name="cards[c1][field1]" value="No">No</label>
    </div>
    <div class="application-question">
      <div>Languages</div>
      <label><input type="checkbox" name="cards[c2][field0]" value="English">English</label>
      <label><input type="checkbox" name="cards[c2][field0]" value="Spanish">Spanish</label>
    </div>
    <div class="application-question"><div>Why us?</div><textarea name="cards[c2][field1]"></textarea></div>
    <div class="hidden">
      <div>What best describes your gender?</div>
      <label><input type="radio" name="surveysResponses[s1][responses][field0]" value="Woman">Woman</label>
      <label><input type="radio" name="surveysResponses[s1][responses][field0]" value="Prefer not to disclose">Prefer not to disclose</label>
    </div>
    <button type="submit" id="btn-submit">Submit application</button>
  </form>
  <script>
    const show = (sel, on) => document.querySelector(sel).classList.toggle("hidden", !on);
    // Resume: "analyzing" for a while, then success and Lever's guesses written over the fields.
    document.querySelector('[name="resume"]').addEventListener("change", (e) => {
      document.querySelector(".filename").textContent = e.target.files[0]?.name ?? "";
      show(".resume-upload-working", true);
      setTimeout(() => {
        show(".resume-upload-working", false);
        show(".resume-upload-success", true);
        document.querySelector('[name="name"]').value = "Jordan Sample";
        document.querySelector('[name="email"]').value = "jordan.sample@example.com";
        document.querySelector('[name="location"]').value = "Denver, CO, USA";
        document.querySelector('[name="selectedLocation"]').value = '{"name":"Denver, CO, USA"}';
      }, 800);
    });
    // Location: suggestions for what's typed; picking one fills the box and the hidden field.
    const loc = document.getElementById("location-input");
    const drop = document.getElementById("location-dropdown");
    const PLACES = ["Atlanta, GA, USA", "Atlanta, TX, USA", "Austin, TX, USA"];
    loc.addEventListener("input", () => {
      drop.innerHTML = "";
      document.querySelector('[name="selectedLocation"]').value = "";
      for (const p of PLACES.filter((p) => loc.value && p.toLowerCase().startsWith(loc.value.toLowerCase()))) {
        const d = document.createElement("div");
        d.className = "dropdown-location";
        d.textContent = p;
        d.addEventListener("click", () => {
          loc.value = p;
          document.querySelector('[name="selectedLocation"]').value = JSON.stringify({ name: p });
          drop.innerHTML = "";
        });
        drop.appendChild(d);
      }
    });
    document.getElementById("application-form").addEventListener("submit", (e) => {
      e.preventDefault();
      document.body.innerHTML = "<h2>Application submitted!</h2><p>Thanks for applying.</p>";
    });
  </script>
</body>
</html>
